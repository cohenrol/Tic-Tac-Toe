spring:
  application:
    name: xo-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${POSTGRES_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    common:
      issuer: ${spring.application.name}
      key-id: "auth-server-ec-key"
      keystore:
        location: ${XO_SERVICE_JWT_KEYSTORE_LOCATION}
        password: ${XO_SERVICE_JWT_KEYSTORE_PASSWORD}
        alias: ${XO_SERVICE_JWT_KEYSTORE_ALIAS}
    users:
      expiration-ms: 900000
      refresh-expiration-ms: 2592000000
      access-key-audience: xo-service
    services:
      common:
        expiration-ms: 3600000
      wish:
        access-key-audience: xo-service