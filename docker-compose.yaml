services:
  xo-service:
    container_name: xo-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      xo-postgres-db:
        condition: service_healthy
    ports:
      - "${XO_SERVICE_EXTERNAL_PORT}:8080"
    volumes:
      - ./.security/keystore.p12:/app/resources/keystore.p12:ro
    env_file:
      - .env
    environment:
      POSTGRES_DATASOURCE_URL: jdbc:postgresql://xo-postgres-db:5432/${POSTGRES_DB}
    networks:
      - xo-net

  xo-postgres-db:
    container_name: xo-database
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${XO_DB_EXTERNAL_PORT}:5432"
    volumes:
      - xo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xo-net

volumes:
  xo-db-data:

networks:
  xo-net:
    driver: bridge